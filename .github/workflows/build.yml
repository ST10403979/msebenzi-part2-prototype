name: Build and Test Msebenzi

# Runs on every push and pull request against main, so the app and API
# are proven to build/pass tests outside of just "my machine".
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend API — install & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Uses whichever lockfile exists; falls back to a plain install if
      # you haven't committed package-lock.json yet (run `npm install`
      # locally once and commit the generated lockfile for faster,
      # reproducible CI runs).
      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

  android-build:
    name: Android app — assemble debug APK
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # NOTE: this project does not commit the Gradle wrapper JAR (binary
      # files don't travel well through some submission pipelines), so CI
      # installs Gradle directly instead of calling ./gradlew. If you
      # generate the wrapper locally (Android Studio does this
      # automatically the first time you open the project, or run
      # `gradle wrapper` yourself), you can switch the two steps below
      # back to `./gradlew assembleDebug` / `./gradlew testDebugUnitTest`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: msebenzi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
